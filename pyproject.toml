[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beautyrec"
version = "0.1.0"
description = "Readable semantic-ID generative recommendation on Amazon 2014 Beauty"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "torch>=2.2"]

[project.optional-dependencies]
text = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.9"]
figures = ["matplotlib>=3.8"]

[project.scripts]
beautyrec = "beautyrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
